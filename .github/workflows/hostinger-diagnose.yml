name: Hostinger Diagnose

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query Hostinger Docker API
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
        run: |
          set -e
          base="https://developers.hostinger.com/api/vps/v1/virtual-machines/1989843/docker"
          for path in "" "/t7iq-differentiation" "/traefik-yo3c" "/n8n_t7iq" "/t7iq-home"; do
            echo "=== $path ==="
            code=$(curl -sS -o response.json -w "%{http_code}"               -H "Authorization: Bearer $HOSTINGER_API_KEY"               -H "Accept: application/json"               "$base$path")
            echo "HTTP_STATUS=$code"
            cat response.json
            echo
          done
