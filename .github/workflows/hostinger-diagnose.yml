name: Hostinger Diagnose

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query Hostinger Docker endpoint
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
        run: |
          set -e
          url="https://developers.hostinger.com/api/vps/v1/virtual-machines/1989843/docker"
          code=$(curl -sS -o response.json -w "%{http_code}"             -H "Authorization: Bearer $HOSTINGER_API_KEY"             -H "Accept: application/json"             "$url")
          echo "HTTP_STATUS=$code"
          cat response.json
          echo
          if [ "$code" -ge 500 ]; then exit 1; fi
