name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy to Hostinger VPS
        uses: hostinger/deploy-on-vps@v2
        with:
          api-key: ${{ secrets.HOSTINGER_API_KEY }}
          virtual-machine: 1989843
          project-name: t7iq-differentiation
          docker-compose-path: docker-compose.hostinger.yml
          environment-variables: |
            NEXT_PUBLIC_SUPABASE_URL=https://mihalnbzprdqaaprjkha.supabase.co
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=sb_publishable_8MvCl5qU4te0v_rWzZWN5g_G3um0uGg
