name: Hostinger DNS Cutover

on:
  push:
    branches: [main]

jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Point diff.t7iq.com to Hostinger VPS
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
        run: |
          set -euo pipefail
          base="https://developers.hostinger.com/api/dns/v1/zones/t7iq.com"

          echo "Current diff record:"
          current=$(curl --fail --show-error --silent             -H "Authorization: Bearer $HOSTINGER_API_KEY"             -H "Accept: application/json"             "$base")
          echo "$current" | jq -c '.[] | select(.name=="diff")'

          if echo "$current" | jq -e '.[] | select(.name=="diff" and .type=="A") | .records[] | select(.content=="76.13.133.122")' >/dev/null; then
            echo "diff.t7iq.com already points to the VPS."
          else
            if echo "$current" | jq -e '.[] | select(.name=="diff" and .type=="CNAME")' >/dev/null; then
              echo "Removing old Vercel CNAME..."
              curl --fail --show-error --silent -X DELETE                 -H "Authorization: Bearer $HOSTINGER_API_KEY"                 -H "Content-Type: application/json"                 -H "Accept: application/json"                 -d '{"filters":[{"name":"diff","type":"CNAME"}]}'                 "$base"
              echo
            fi

            echo "Creating VPS A record..."
            curl --fail --show-error --silent -X PUT               -H "Authorization: Bearer $HOSTINGER_API_KEY"               -H "Content-Type: application/json"               -H "Accept: application/json"               -d '{"overwrite":true,"zone":[{"name":"diff","type":"A","ttl":300,"records":[{"content":"76.13.133.122"}]}]}'               "$base"
            echo
          fi

          echo "Updated diff record:"
          curl --fail --show-error --silent             -H "Authorization: Bearer $HOSTINGER_API_KEY"             -H "Accept: application/json"             "$base" | jq -c '.[] | select(.name=="diff")'
