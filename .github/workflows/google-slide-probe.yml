name: Canonical Google Slides Snapshot Health
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/google-slide-probe.yml"
      - "app/present/**"
  workflow_dispatch:
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify trusted 38-page Google Slides export on public storage
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --max-time 40 \
            https://mihalnbzprdqaaprjkha.supabase.co/storage/v1/object/public/workshop-public-assets/google-slides-canonical-2026-10-23.pdf \
            -o /tmp/canonical.pdf
          test "$(head -c 4 /tmp/canonical.pdf)" = '%PDF'
          actual_pages="$(pdfinfo /tmp/canonical.pdf | awk '/^Pages:/ {print $2}')"
          echo "Canonical Google Slides export has $actual_pages pages"
          test "$actual_pages" = 38
          test "$(stat -c%s /tmp/canonical.pdf)" -gt 3000000
