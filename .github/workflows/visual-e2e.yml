name: Visual E2E Journey

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - "app/w/**"
      - "app/admin/**"
      - "app/login/**"
      - "app/globals.css"
      - "tests/**"
      - ".github/workflows/visual-e2e.yml"

jobs:
  visual-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Wait for production deployment
        run: |
          for i in {1..30}; do
            code=$(curl -L -s -o /dev/null -w "%{http_code}" https://diff.t7iq.com/w/DEMO26 || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run visual journey
        env:
          BASE_URL: https://diff.t7iq.com
        run: npx playwright test tests/visual-journey.spec.ts --project=chromium --reporter=line
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-e2e-evidence
          path: |
            test-results/*.png
            test-results/*.pdf
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
