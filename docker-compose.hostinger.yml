services:
  differentiation:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
    container_name: t7iq-differentiation
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3100:3000"
    labels:
      traefik.enable: "true"
      traefik.http.routers.t7iq-differentiation.rule: "Host(`diff.t7iq.com`)"
      traefik.http.routers.t7iq-differentiation.entrypoints: "websecure"
      traefik.http.routers.t7iq-differentiation.tls: "true"
      traefik.http.routers.t7iq-differentiation.tls.certresolver: "letsencrypt"
      traefik.http.services.t7iq-differentiation.loadbalancer.server.port: "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
